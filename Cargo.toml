[package]
name = "mirage"
version = "0.1.0"
edition = "2018"
description = "A small library for generating synthetic video"
publish = false

[features]
default = ["h264"]
h264 = ["openh264"]
vp8 = ["vpx-encode"]
opus = ["audiopus"]

[dependencies]
openh264 = { version = "=0.2.8", optional = true, default-features = false, features = ["encoder"] }
vpx-encode = { version = "=0.6.0", optional = true }
audiopus = { version = "=0.2.0", optional = true, default-features = false, features = ["encoder"] }

[patch.crates-io]
vpx-encode = { path = "third-party/vpx-encode" }

[[test]]
name = "encoder"
required-features = ["h264"]

[[test]]
name = "generator"
required-features = ["h264"]

[[test]]
name = "vpx"
required-features = ["vp8"]

[[test]]
name = "opus"
required-features = ["opus"]
